packages:
  - '.'
  - 'packages/schemas'

overrides:
  # Release notes: release-notes-generator 14 declares writer ^8, but the
  # conventionalcommits@10 preset needs writer 9. Exit when the direct
  # release-notes-generator reaches 15, which declares ^9.
  conventional-changelog-writer: ^9.3.0

  # Security pins. Advisory IDs, owning ranges and exit conditions are in docs/dependencies.md.
  '@actions/http-client>undici': ^8.13.1
  '@devframes/agentic>@modelcontextprotocol/client': ^2.4.0
  '@devframes/agentic>@modelcontextprotocol/server': ^2.4.0
  '@eslint/css-tree>source-map-js': ^1.2.4
  '@semantic-release/github>undici': ^8.13.1
  '@swc/cli>piscina': ^4.9.4
  '@xhmikosr/downloader>@xhmikosr/decompress': ^11.1.4
  'cosmiconfig@8>js-yaml': ^4.3.2
  'cosmiconfig@9>js-yaml': ^4.3.2
  'magicast>source-map-js': ^1.2.4
  'vitest>vite': ^8.3.8
  esbuild: ^0.28.2

allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': true
  '@swc/core': true
  esbuild: true
  unrs-resolver: true

supportedArchitectures:
  os:
    - linux
    - darwin
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl
minimumReleaseAge: 0
