# Docker Compose configuration for MongoDB service used in acceptance tests
# This configuration is linked to "docker:acceptance-tests:*" scripts in the root package.json

services:
  mongo:
    container_name: "mongo-acceptance-tests"
    image: mongo:9.0.8@sha256:b0c835c26e5997413e985000f1013c275377cd9607761c1784d486f6dd620b7f
    environment:
      MONGO_INITDB_DATABASE: goat-it-api-acceptance-tests
    ports:
      - "27019:27017"
    volumes:
      - mongodb_data_container:/data/db
    healthcheck:
      test: mongosh localhost:27017 --eval 'db.adminCommand("ping")' --quiet
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongodb_data_container:
