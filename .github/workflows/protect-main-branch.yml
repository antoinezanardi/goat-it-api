name: 🛡️ Protect main branch
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  require-develop-source:
    name: Require PR from develop branch ⛵
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Comment and fail if PR source branch is not 'develop' ❌
        if: ${{ github.event.pull_request.head.ref != 'develop' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const headRef = context.payload.pull_request.head.ref
            const body = `🚫 Pull requests to main must come from 'develop', but this PR comes from '${headRef}'. Please retarget this PR to 'develop'.`

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            })

            throw new Error(body)
