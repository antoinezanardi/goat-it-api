name: 📦 Publish @goat-it/schemas Workflow

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'packages/schemas/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-and-publish:
    name: Check and publish @goat-it/schemas 📦
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install project 📦
        uses: ./.github/actions/install-project

      - name: Compute version and dist-tag 🔢
        id: compute-version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          BASE_VERSION=$(node -p "require('./packages/schemas/package.json').version")
          if [ "$REF_NAME" = "develop" ]; then
            echo "version=${BASE_VERSION}-beta" >> "$GITHUB_OUTPUT"
            echo "dist-tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
            echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if version already exists on npm 🔍
        id: check-version
        shell: bash
        env:
          VERSION: ${{ steps.compute-version.outputs.version }}
        run: |
          if npm view "@goat-it/schemas@$VERSION" version --json 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip publication (version already published) ⏭️
        if: steps.check-version.outputs.exists == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.compute-version.outputs.version }}
        run: echo "Version $VERSION already exists on npm – skipping publication."

      - name: Setup Node.js for npm publish 🔧
        if: steps.check-version.outputs.exists == 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: configs/node/.node-version
          registry-url: https://registry.npmjs.org

      - name: Patch package.json version if necessary 🔧
        if: steps.check-version.outputs.exists == 'false'
        shell: bash
        working-directory: packages/schemas
        env:
          VERSION: ${{ steps.compute-version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish @goat-it/schemas to npm 🚀
        if: steps.check-version.outputs.exists == 'false'
        shell: bash
        working-directory: packages/schemas
        env:
          DIST_TAG: ${{ steps.compute-version.outputs.dist-tag }}
        run: pnpm publish --tag "$DIST_TAG" --no-git-checks --access public --provenance
