name: 🔃 Lint PR Name Into Develop Workflow

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  develop-pr-lint:
    name: Lint Pull Request Name 🔃
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Lint Pull Request Name 🔃
        uses: morrisoncole/pr-lint-action@51f3cfabaf5d46f94e54524214e45685f0401b2a # v1.7.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          title-regex: '^(?<type>build|tech|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(?:\((?<scope>[\w-]+)\))?(?<breaking>!)?(?<subject>:\s.+)$'
          on-failed-regex-fail-action: true
          on-failed-regex-create-review: true
          on-failed-regex-request-changes: false
          on-failed-regex-comment: "[Auto-generated comment] Your Pull Request name is not compliant to conventional commits : ```%regex%```!"
