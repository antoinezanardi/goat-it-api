name: 🔃️ Upsert PR Release Workflow

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      mode:
        description: "refresh updates the release pull request only; prepare-release also creates or refreshes the version commit pull request"
        type: choice
        options:
          - refresh
          - prepare-release
        default: refresh

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  install:
    name: Install ⚙️
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop

      - name: Install project 📦
        uses: ./.github/actions/install-project

  get-next-release-version:
    name: Get next release version 🏷️
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs:
      - install
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          persist-credentials: false
          fetch-depth: 0

      - name: Compute release changelog 🏷️
        id: release
        uses: ./.github/actions/compute-release-changelog
        with:
          semantic-release-token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

    outputs:
      new-release-version: ${{ steps.release.outputs.new-release-version }}

  upsert-pr-release:
    name: Upsert Pull Request Release 🔃
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs:
      - get-next-release-version
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop

      - name: Restore release changelog from cache 🥡
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: cache-release-changelog
        with:
          path: |
            RELEASE.md
            CHANGELOG_SECTION.md
          key: ${{ runner.os }}-release-changelog-${{ github.run_id }}

      - name: List open PR into main 📋
        env:
          GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
        run: |
          OPEN_PR_INTO_MAIN=$(gh pr list --state open -B main --search "Release in:title" --json number,title)
          echo "OPEN_PR_INTO_MAIN=$OPEN_PR_INTO_MAIN" >> "$GITHUB_ENV"

      - name: Set PR Title 🔤
        env:
          RELEASE_VERSION: ${{ needs.get-next-release-version.outputs.new-release-version }}
        run: |
          PR_TITLE="Release v$RELEASE_VERSION"
          echo "PR_TITLE=$PR_TITLE" >> "$GITHUB_ENV"

      - name: Determine action to perform on PR 🚏
        run: |
          if [[ "$OPEN_PR_INTO_MAIN" != "[]" ]]; then
            PR_NUMBER=$(echo "$OPEN_PR_INTO_MAIN" | jq -r '.[0].number')
            if [[ -n "$PR_NUMBER" ]]; then
              echo "PR_ACTION=update" >> "$GITHUB_ENV"
              echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
            else
              echo "PR_ACTION=create" >> "$GITHUB_ENV"
            fi
          else
            echo "PR_ACTION=create" >> "$GITHUB_ENV"
          fi

      - name: Create Release PR if it doesn't exist 🔃
        if: env.PR_ACTION == 'create' && needs.get-next-release-version.outputs.new-release-version != ''
        env:
          GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: gh pr create --repo "$REPOSITORY" --title "$PR_TITLE" --body "$(cat RELEASE.md)" --assignee "antoinezanardi" --label "🏷️ release" --base main --head develop

      - name: Update Release PR if it exists 🔃
        if: env.PR_ACTION == 'update' && needs.get-next-release-version.outputs.new-release-version != ''
        env:
          GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: gh pr edit "$PR_NUMBER" --repo "$REPOSITORY" --title "$PR_TITLE" --body "$(cat RELEASE.md)"

  prepare-release:
    name: Prepare release 🧾
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'prepare-release'
    uses: ./.github/workflows/prepare-release.yml
    secrets:
      SEMANTIC_RELEASE_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
