name: 🏷️ Release Creation Workflow

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  code-ql:
    name: CodeQL Scan ❇️
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Perform CodeQL Analysis ❇️
        uses: ./.github/actions/code-ql

  install:
    name: Install ⚙️
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install project 📦
        uses: ./.github/actions/install-project

  release:
    name: Release 🏷️
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - install
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install project 📦
        uses: ./.github/actions/install-project

      - name: Release 🏷️
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
        run: npx semantic-release

    outputs:
      new-release-published: ${{ steps.release.outputs.new-release-published }}
      new-release-version: ${{ steps.release.outputs.new-release-version }}

  sync-develop:
    name: Sync Develop 🔄
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs:
      - release
    if: needs.release.outputs.new-release-published == 'true'
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Merge main into develop through a pull request 🔄
        env:
          GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.release.outputs.new-release-version }}
        run: |
          branch="chore/sync-release-v${RELEASE_VERSION}"
          git fetch origin main
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "refs/remotes/origin/main:refs/heads/${branch}"
          existing=$(gh pr list --repo "$REPOSITORY" --base develop --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [[ -z "$existing" ]]; then
            gh pr create --repo "$REPOSITORY" --base develop --head "$branch" --title "chore: sync release v${RELEASE_VERSION} from main" --body "Automated post-release merge of main into develop so the next release pull request stays up to date and the release tag stays reachable from develop. See docs/release.md."
          fi
          number=$(gh pr list --repo "$REPOSITORY" --base develop --head "$branch" --state open --json number --jq '.[0].number')
          gh pr merge "$number" --repo "$REPOSITORY" --merge --auto

  unit-tests:
    name: Unit Tests 🧪
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - install
    outputs:
      vitest-tests-count: ${{ steps.unit-tests.outputs.vitest-tests-count }}
      vitest-statements-count: ${{ steps.unit-tests.outputs.vitest-statements-count }}
      vitest-branches-count: ${{ steps.unit-tests.outputs.vitest-branches-count }}
      vitest-functions-count: ${{ steps.unit-tests.outputs.vitest-functions-count }}
      vitest-lines-count: ${{ steps.unit-tests.outputs.vitest-lines-count }}
      vitest-statements-percent: ${{ steps.unit-tests.outputs.vitest-statements-percent }}
      vitest-branches-percent: ${{ steps.unit-tests.outputs.vitest-branches-percent }}
      vitest-functions-percent: ${{ steps.unit-tests.outputs.vitest-functions-percent }}
      vitest-lines-percent: ${{ steps.unit-tests.outputs.vitest-lines-percent }}
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Unit Tests 🧪
        id: unit-tests
        uses: ./.github/actions/unit-tests

  mutation-tests:
    name: Mutation Tests 👽
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: Stryker Dashboard
      url: ${{ steps.mutation-tests.outputs.mutation-tests-dashboard-url }}
    needs:
      - install
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Mutation Tests 👽
        id: mutation-tests
        uses: ./.github/actions/mutation-tests
        with:
          stryker-dashboard-api-key: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}

  acceptance-tests:
    name: Acceptance Tests 🥒
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - install
    outputs:
      acceptance-tests-count: ${{ steps.acceptance-tests.outputs.acceptance-tests-count }}
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Acceptance Tests 🥒
        id: acceptance-tests
        uses: ./.github/actions/acceptance-tests

  badges:
    name: Generate Badges 💠
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - unit-tests
      - acceptance-tests
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate Badges 💠
        uses: ./.github/actions/badges
        with:
          byob-token: ${{ secrets.BYOB_TOKEN }}
          unit-tests-count: ${{ needs.unit-tests.outputs.vitest-tests-count }}
          unit-tests-covered-statements: ${{ needs.unit-tests.outputs.vitest-statements-count }}
          unit-tests-covered-branches: ${{ needs.unit-tests.outputs.vitest-branches-count }}
          unit-tests-covered-functions: ${{ needs.unit-tests.outputs.vitest-functions-count }}
          unit-tests-covered-lines: ${{ needs.unit-tests.outputs.vitest-lines-count }}
          unit-tests-statements-percent: ${{ needs.unit-tests.outputs.vitest-statements-percent }}
          unit-tests-branches-percent: ${{ needs.unit-tests.outputs.vitest-branches-percent }}
          unit-tests-functions-percent: ${{ needs.unit-tests.outputs.vitest-functions-percent }}
          unit-tests-lines-percent: ${{ needs.unit-tests.outputs.vitest-lines-percent }}
          acceptance-tests-count: ${{ needs.acceptance-tests.outputs.acceptance-tests-count }}

  sonarcloud:
    name: SonarCloud Analysis 🌥️
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - unit-tests
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: SonarCloud Analysis 🌥️
        uses: ./.github/actions/sonarcloud
        with:
          sonarcloud-token: ${{ secrets.SONARCLOUD_TOKEN }}
