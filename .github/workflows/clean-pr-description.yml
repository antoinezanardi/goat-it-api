name: 🧹 Clean PR Description Workflow

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - edited

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  clean-pr-description:
    name: Clean PR Description 🧹
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Clean PR description from numbered diffhunk links 🧹
        run: scripts/clean-pr-description.sh ${{ github.event.pull_request.number }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
