name: Audit Dependencies 🛡️
description: Audits the production dependency surface for high or critical advisories and checks its licenses against the allowlist.
author: Antoine ZANARDI

runs:
  using: composite
  steps:
    - name: Install project 📦
      uses: ./.github/actions/install-project

    - name: Audit dependencies 🛡️
      shell: bash
      run: pnpm audit --prod --audit-level=high

    - name: Check dependency licenses 🛡️
      shell: bash
      run: pnpm run check:licenses
