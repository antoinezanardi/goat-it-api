name: Audit Dependencies 🛡️
description: Audits the production dependencies for any advisory, the full dependency tree for high or critical advisories and the production licenses against the allowlist.
author: Antoine ZANARDI

runs:
  using: composite
  steps:
    - name: Install project 📦
      uses: ./.github/actions/install-project

    - name: Audit production dependencies 🛡️
      shell: bash
      run: pnpm audit --prod --audit-level=low

    - name: Audit the full dependency tree 🛡️
      shell: bash
      run: pnpm audit --audit-level=high

    - name: Check dependency licenses 🛡️
      shell: bash
      run: pnpm run check:licenses
