name: Build App ✨
description: Builds the application for production
author: Antoine ZANARDI
runs:
  using: composite
  steps:
    - name: Install project 📦
      uses: ./.github/actions/install-project

    - name: Typecheck 🪨
      shell: bash
      run: pnpm run typecheck

    - name: Build application ✨
      shell: bash
      run: pnpm run build

    - name: Check built output for leaked secrets 🔒
      shell: bash
      run: pnpm run check:secrets-in-built-output

    - name: Verify build was successful ✅
      shell: bash
      run: test -f dist/main.js
