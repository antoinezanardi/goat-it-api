name: Lint 🔍
description: Lint the codebase to ensure code quality and consistency.
author: Antoine ZANARDI

runs:
  using: composite
  steps:
    - name: Check tracked env files 🔐
      id: check-tracked-env-files
      shell: bash
      run: sh scripts/check-tracked-env-files.sh

    - name: Install project 📦
      uses: ./.github/actions/install-project

    - name: Check Oxlint rules inventory and linter option parity 🔗
      shell: bash
      run: pnpm run lint:oxlint:check-rules

    - name: Check and lint code 🔍
      id: lint
      shell: bash
      run: pnpm run lint
