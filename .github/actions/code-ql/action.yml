name: CodeQL Analysis ❇️
description: Run GitHub CodeQL analysis for code scanning.
author: Antoine ZANARDI

runs:
  using: composite
  steps:
    - name: Initialize CodeQL ⚙️
      uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
      with:
        languages: 'javascript,typescript'

    - name: AutoBuild 🌡️
      uses: github/codeql-action/autobuild@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
