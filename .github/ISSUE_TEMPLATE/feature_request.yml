name: 🚀 Feature request
description: Suggest an idea or improvement for Goat It API.
title: "🚀 [Feature]: "
labels:
  - 🚀 feature
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Goat It API. Please search existing issues before opening a new one.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Is your feature request related to a problem? Describe it.
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the solution you would like, including the affected endpoint or API capability.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: API area
      description: Which part of the API does this request target?
      multiple: true
      options:
        - Public API
        - Admin API
        - Persistence
        - Observability
        - Developer experience
        - Other

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions or features you have considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context, mockups, or screenshots about the feature request.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
